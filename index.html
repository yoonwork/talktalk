<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>사용할 수 없는 링크</title>
<style>
:root{--bg:#eef3f2;--panel:#fff;--ink:#15211f;--muted:#62716e;--accent:#0f6b5c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1716;--panel:#162220;--ink:#e4eeec;--muted:#8fa29e;--accent:#4cc3ab;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px;box-sizing:border-box}
.card{background:var(--panel);border-radius:18px;padding:28px 24px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px;color:var(--accent)}
p{margin:0;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h1>사용할 수 없는 링크예요</h1>
  <p>이 링크는 더 이상 쓰지 않아요.<br>새 링크는 방장에게 받아 주세요.</p>
</div>
</body>
</html>
